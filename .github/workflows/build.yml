# Compila o Jarvis e o Jarvis Launcher para Mac (Apple Silicon), Windows e Linux e publica na loja do Jarvis
# (jarvis.agcunae.com, scripts/loja.py): o launcher de cada pessoa mostra a atualização e baixa só o que mudou.
# O GitHub só compila: nada é publicado aqui (os pacotes ficam 1 dia, para conferência). Os dados de quem usa
# nunca passam pelo GitHub. Roda numa tag v* (ex.: v2.10.0) ou à mão (Actions → Compilar o Jarvis → Run workflow).
name: Compilar o Jarvis

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  LOJA_URL: ${{ secrets.LOJA_URL }}
  LOJA_TOKEN: ${{ secrets.LOJA_TOKEN }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            nome: mac
            bundles: app
          - os: windows-latest
            nome: windows
            bundles: nsis
          - os: ubuntu-22.04
            nome: linux
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema (Linux)
        if: matrix.nome == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libportaudio2 portaudio19-dev libgtk-3-dev libxdo-dev file

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable

      - name: Modelos (voz offline e mãos)
        run: scripts/modelos.sh

      - name: Interface (React)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Motor financeiro (Node) e testes
        working-directory: financeiro/motor
        run: |
          # o better-sqlite3 já traz o binário pronto de cada sistema (prebuilds/): sem compilar (no Windows exigiria o Visual Studio)
          npm ci --omit=dev --ignore-scripts
          # fica só o binário deste sistema (os outros incham o pacote e o gerador de AppImage trava neles)
          node -e "const fs=require('fs'),p='node_modules/better-sqlite3/prebuilds',k=process.platform+'-'+process.arch+'.node';for(const f of fs.readdirSync(p))if(f!==k)fs.rmSync(p+'/'+f);console.log(fs.readdirSync(p))"
          npm test
          # o Node vai junto com o Jarvis: quem instala não precisa ter nada
          mkdir -p ../../backend/node-bin
          if [ "${{ matrix.nome }}" = "windows" ]; then cp "$(command -v node).exe" ../../backend/node-bin/ 2>/dev/null || cp "$(command -v node)" ../../backend/node-bin/node.exe; else cp "$(command -v node)" ../../backend/node-bin/node; fi
          ls -la ../../backend/node-bin

      - name: Núcleo (Python → executável)
        working-directory: backend
        run: |
          uv sync --group build --python 3.12
          uv run --group build pyinstaller jarvis-core.spec --noconfirm --log-level WARN

      - name: Teste rápido do núcleo empacotado
        working-directory: backend
        run: |
          EXE=dist/jarvis-core/jarvis-core
          [ "${{ matrix.nome }}" = "windows" ] && EXE=dist/jarvis-core/jarvis-core.exe
          export JARVIS_HOME="$RUNNER_TEMP/jarvis-teste"
          "$EXE" --verificar
          export JARVIS_TESTE=1 JARVIS_PORT=8765
          "$EXE" > "$RUNNER_TEMP/core.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8765/health || (cat "$RUNNER_TEMP/core.log"; exit 1)
          curl -sf http://127.0.0.1:8765/ | grep -q '<div id="root">' || (echo "interface não veio"; exit 1)
          curl -sf http://127.0.0.1:8765/api/setup
          # financeiro: o motor (Node empacotado) responde e lança pela voz
          curl -sf -X POST http://127.0.0.1:8765/api/fin/c/app:needsOnboarding -H 'content-type: application/json' -d '{}' | grep -q '"ok":true' || (cat "$RUNNER_TEMP/core.log"; cat "$JARVIS_HOME/financeiro.log"; exit 1)
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/reiniciar', data=b'')" || true

      - name: App (Tauri)
        working-directory: app
        env:
          NO_STRIP: "true" # o linuxdeploy (AppImage) não sabe "afinar" o Node empacotado e falharia
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }} --verbose

      - name: Separar o pacote
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASS: ${{ secrets.MAC_CERT_PASS }}
        run: |
          mkdir -p out
          B=app/src-tauri/target/release/bundle
          case "${{ matrix.nome }}" in
            mac)
              # assinatura com o certificado próprio "Jarvis Local": as permissões não caem a cada versão
              scripts/assinar-mac.sh "$B/macos/Jarvis.app"
              # instalador de verdade: Continuar → Instalar, coloca em Aplicativos e abre a configuração
              scripts/pacote-mac.sh "$B/macos/Jarvis.app" "$(cat VERSION)" "out/Instalar Jarvis.pkg" ;;
            windows)
              cp $B/nsis/*-setup.exe "out/Instalar Jarvis.exe" ;;
            linux)
              cp $B/appimage/*.AppImage out/Jarvis-Linux.AppImage
              cp $B/deb/*.deb out/Jarvis-Linux.deb ;;
          esac
          ls -la out

      - name: Publicar na loja (o launcher de cada pessoa recebe a atualização)
        if: env.LOJA_TOKEN != ''
        env:
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          V=$(cat VERSION)
          NOTAS="$(git log -1 --format=%s)"
          B=app/src-tauri/target/release/bundle
          case "${{ matrix.nome }}" in
            mac) RAIZ="$B/macos/Jarvis.app" ;;
            windows)
              # a árvore exata que o instalador põe no computador: instala em silêncio numa pasta e publica ela
              RAIZ="$RUNNER_TEMP/jarvis-arvore"
              WIN=$(cygpath -w "$RAIZ")
              "./out/Instalar Jarvis.exe" /S "/D=$WIN"
              for i in $(seq 1 60); do [ -d "$RAIZ/core" ] && break; sleep 2; done
              sleep 5
              ls "$RAIZ" ;;
            linux)
              # o AppImage aberto (AppDir): o launcher instala a pasta e roda o AppRun
              (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/out/Jarvis-Linux.AppImage" --appimage-extract > /dev/null)
              RAIZ="$RUNNER_TEMP/squashfs-root" ;;
          esac
          python scripts/loja.py publicar --produto jarvis --sistema ${{ matrix.nome }} --versao "$V" --raiz "$RAIZ" --notas "$NOTAS"

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-${{ matrix.nome }}
          path: out/*
          retention-days: 1

  launcher:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            nome: mac
            bundles: app
          - os: windows-latest
            nome: windows
            bundles: nsis
          - os: ubuntu-22.04
            nome: linux
            bundles: appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do sistema (Linux)
        if: matrix.nome == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev file
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Launcher (Tauri)
        working-directory: launcher
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }}
      - name: Assinar, empacotar e publicar
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASS: ${{ secrets.MAC_CERT_PASS }}
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          V=$(cat launcher/VERSION)
          B=launcher/src-tauri/target/release/bundle
          mkdir -p out
          case "${{ matrix.nome }}" in
            mac)
              scripts/assinar-mac.sh "$B/macos/Jarvis Launcher.app"
              # instalador do site: imagem de disco com o app e o atalho para Aplicativos
              mkdir -p "$RUNNER_TEMP/dmg" && cp -R "$B/macos/Jarvis Launcher.app" "$RUNNER_TEMP/dmg/" && ln -s /Applications "$RUNNER_TEMP/dmg/Aplicativos"
              hdiutil create -volname "Jarvis Launcher" -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO "out/Jarvis Launcher.dmg"
              RAIZ="$B/macos/Jarvis Launcher.app"; INST="out/Jarvis Launcher.dmg" ;;
            windows)
              cp $B/nsis/*-setup.exe "out/Instalar Jarvis Launcher.exe"
              RAIZ="$RUNNER_TEMP/launcher-arvore"
              "./out/Instalar Jarvis Launcher.exe" /S "/D=$(cygpath -w "$RAIZ")"
              for i in $(seq 1 60); do ls "$RAIZ"/*.exe > /dev/null 2>&1 && break; sleep 2; done
              sleep 3
              INST="out/Instalar Jarvis Launcher.exe" ;;
            linux)
              cp $B/appimage/*.AppImage out/Jarvis-Launcher.AppImage
              chmod +x out/Jarvis-Launcher.AppImage
              INST="out/Jarvis-Launcher.AppImage" ;;
          esac
          ls -la out
          if [ -n "$LOJA_TOKEN" ]; then
            if [ "${{ matrix.nome }}" = "linux" ]; then
              python scripts/loja.py publicar --produto launcher --sistema linux --versao "$V" --arquivo "$INST"
            else
              python scripts/loja.py publicar --produto launcher --sistema ${{ matrix.nome }} --versao "$V" --raiz "$RAIZ"
            fi
            python scripts/loja.py publicar --produto instalador --sistema ${{ matrix.nome }} --versao "$V" --arquivo "$INST"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.nome }}
          path: out/*
          retention-days: 1
